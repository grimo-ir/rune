# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
name: rune-gpu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: latest
      # CPU-only runner: GPU tests need hardware, so verify the full
      # cross-compile matrix instead. Each target must at least build.
      # Real GPU runs happen on Verda VMs (see README ## Verified GPUs);
      # macOS runners have no Metal GPU access, so no macOS job.
      - name: Cross-compile all GPU targets
        run: |
          for t in sm_80 sm_86 sm_89 sm_90 sm_120; do
            for f in vecadd reduce matmul copy_bench; do
              pixi run mojo build --target-accelerator=$t -I . tests/$f.mojo -o /tmp/$f-$t
            done
          done

  publish:
    needs: test-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/rattler-build-action@v0.2.34
        with:
          artifact-name: rune-${{ github.ref_name }}
      - name: Publish to prefix.dev
        run: |
          for pkg in $(find output -type f -name "*.conda"); do
            rattler-build upload prefix --channel nitg3n/rune "$pkg"
          done
